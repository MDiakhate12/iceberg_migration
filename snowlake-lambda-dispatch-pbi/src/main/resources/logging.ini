[loggers]
keys=root

[handlers]
keys=root_handler

[formatters]
keys=root_formatter

[logger_root]
level=INFO
handlers=root_handler

[handler_root_handler]
class=StreamHandler
level=NOTSET
formatter=root_formatter
args=(sys.stdout,)
encoding='utf-8'

[formatter_root_formatter]
format=[%(levelname)-4s] %(asctime)-20s : %(message)s
class=logging.Formatter
